# ----------------------------------------------------------------------------
# default
# ----------------------------------------------------------------------------

default:
  image: debian:stable

# ----------------------------------------------------------------------------
# stages
# ----------------------------------------------------------------------------

stages:
  - build

# ----------------------------------------------------------------------------
# build-debian-amd64
# ----------------------------------------------------------------------------

build-debian-amd64:
  image: debian:trixie-backports
  stage: build
  tags:
    - docker
    - amd64
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "release"
  before_script:
    - ./.ci/ci-setup-debian.sh
  script:
    - ./.ci/ci-build-debian.sh
  after_script:
    - ./.ci/ci-cleanup.sh
  artifacts:
    name: "timesheet-debian-amd64"
    paths:
      - ./_dist/*.buildinfo
      - ./_dist/*.changes
      - ./_dist/*.deb

# ----------------------------------------------------------------------------
# End-Of-File
# ----------------------------------------------------------------------------
